[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "remo-alt"
version = "0.0.1"
dependencies = [
    "pylint",
    "carla"
]
authors = [
]
description = "A tool for replaying CARLA failure scenarios with modifications"
readme = "README.md"
requires-python = "=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]